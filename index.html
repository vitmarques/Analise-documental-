.container { max-width: 950px; margin: 0 auto; background: rgba(255,255,255,.985); padding: 40px; border-radius: var(--border-radius-main); box-shadow: 0 14px 42px rgba(42,35,39,.08); }
header { font-size: 26px; font-weight: 700; color: var(--germany-black); margin-bottom: 35px; border-bottom: 2px solid #f0f2f5; padding-bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }

<body>
<div class="container">
  <header> Análise documental <div class="logo-badge">Cidadania4u</div></header>

  <section class="selector-processo">
    <h2>Identificação do processo</h2>
    <div class="row">
      <div style="flex:1; min-width:0">
        <label for="tipo-cidadania">Tipo de cidadania</label>
        <select id="tipo-cidadania" onchange="alterarTipoCidadania()">
          <option value="">Selecione</option>
          <option value="alema">Cidadania Alemã</option>
          <option value="portuguesa">Cidadania Portuguesa</option>
        </select>
      </div>
      <div id="campo-tipo-processo" class="hidden" style="flex:1; min-width:0">
        <label for="tipo-processo-portugues">Tipo de processo português</label>
        <select id="tipo-processo-portugues" onchange="alterarProcessoPortugues()">
          <option value="">Selecione</option>
          <option value="netos-maiores">Netos Maiores</option>
          <option value="netos-menores">Netos Menores</option>
          <option value="filho-maior">Filho Maior</option>
          <option value="filho-menor">Filho Menor</option>
          <option value="casamento">Processo por Casamento</option>
          <option value="homologacao">Homologação de Divórcio</option>
        </select>
      </div>
    </div>
  </section>

  <div class="box hidden" id="box-genealogia">
    <h2 id="titulo-genealogia">Árvore Genealógica (Gerações)</h2>
    <div id="geracoes"></div>
    <button class="btn-add" id="btn-add-geracao" onclick="addGeracao()">+ Adicionar Geração</button>
  </div>

  <section id="portugal-documentos" class="hidden">
    <div class="card">
      <div class="title">Dados do processo</div>
      <div id="campos-processo-portugues"></div>
    </div>
    <div id="lista-documentos-portugueses"></div>
    <button class="btn-add" type="button" onclick="adicionarDocumentoPortugues()">+ Adicionar documento</button>
  </section>

  <div class="footer"><button class="btn-submit" onclick="gerarPDF()">GERAR PDF</button></div>
</div>

<script>
const parentesco = { 1: "Ascendente de origem", 2: "Filho(a)", 3: "Neto(a)", 4: "Bisneto(a)", 5: "Trineto(a)" };
let proximoIdDivergencia = 1;
let proximoIdDocumentoPortugal = 1;

const processosGenealogicosPortugal = ["netos-maiores", "netos-menores", "filho-maior", "filho-menor"];
const processosComResidenciaPortugal = ["netos-maiores", "netos-menores", "casamento"];

/* Mantém todas as datas no padrão brasileiro DD/MM/AAAA, inclusive no PDF. */
function formatarDataPortugal(data) {
  if (!data) return "-";
  const valor = String(data).trim();

  if (/^\d{2}\/\d{2}\/\d{4}$/.test(valor)) return valor;

  const partes = valor.split("-");
  if (partes.length === 3 && partes[0].length === 4) {
    const [ano, mes, dia] = partes;
    return `${dia}/${mes}/${ano}`;
  }
  return valor;
}

/* Aplica a máscara brasileira enquanto a data é digitada. */
function aplicarMascaraDataBR(campo) {
  let numeros = campo.value.replace(/\D/g, "").slice(0, 8);
  if (numeros.length > 4) {
    numeros = numeros.replace(/^(\d{2})(\d{2})(\d+)/, "$1/$2/$3");
  } else if (numeros.length > 2) {
    numeros = numeros.replace(/^(\d{2})(\d+)/, "$1/$2");
  }
  campo.value = numeros;
}

document.addEventListener("input", function(evento) {
  if (evento.target.classList.contains("date-br")) {
    aplicarMascaraDataBR(evento.target);
  }
});

/* Validação exclusiva dos campos portugueses */
function validarCamposObrigatoriosPortugal() {
  const areas = [
    document.getElementById("geracoes"),
    document.getElementById("portugal-documentos")
  ];

  const camposInvalidos = [];
  const gruposRadioVerificados = new Set();

  function estaVisivel(elemento) {
    return !elemento.closest(".hidden") && !elemento.disabled;
  }

  areas.forEach(area => {
    if (!area || area.closest(".hidden")) return;

    area.querySelectorAll("input, select, textarea").forEach(el => {
      if (!estaVisivel(el)) return;

      if (
        el.type === "checkbox" ||
        el.type === "button" ||
        el.type === "hidden"
      ) return;

      if (
        el.classList.contains("observacoes-pessoa") ||
        el.classList.contains("pt-observacoes-processo") ||
        el.classList.contains("pt-documento-observacoes")
      ) return;

      if (el.type === "radio") {
        if (gruposRadioVerificados.has(el.name)) return;
        gruposRadioVerificados.add(el.name);

        const grupo = Array.from(
          area.querySelectorAll(`input[type="radio"][name="${el.name}"]`)
        ).filter(estaVisivel);

        if (grupo.length && !grupo.some(radio => radio.checked)) {
          const pergunta = el.closest(
            ".portugal-extra, .divergencia-section, .residencia-requerente, .divergencia-opcoes"
          );

          const titulo = pergunta?.querySelector(
            ".field-label, .divergencia-heading"
          )?.textContent.trim() || "Pergunta sem resposta";

          camposInvalidos.push({ elemento: el, nome: titulo });
        }
        return;
      }

      if (!String(el.value || "").trim()) {
        const nome =
          el.getAttribute("placeholder") ||
          el.getAttribute("aria-label") ||
          el.closest(".campo-data")?.querySelector("label")?.textContent.trim() ||
          el.options?.[0]?.textContent ||
          "Campo obrigatório";

        camposInvalidos.push({ elemento: el, nome });
      }
    });
  });

  if (camposInvalidos.length) {
    const primeiro = camposInvalidos[0];

    alert(
      "Não foi possível gerar o PDF.\n\n" +
      "Existem campos obrigatórios sem preenchimento.\n\n" +
      "Verifique:\n" +
      camposInvalidos.slice(0, 8).map(c => "• " + c.nome).join("\n") +
      (camposInvalidos.length > 8
        ? `\n\nE mais ${camposInvalidos.length - 8} campo(s).`
        : "")
    );

    primeiro.elemento.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

    primeiro.elemento.focus();
    return false;
  }

  return true;
}

function alterarTipoCidadania() {
  const tipo = document.getElementById("tipo-cidadania").value;
  document.body.classList.toggle("modo-portugal", tipo === "portuguesa");
  const campoProcesso = document.getElementById("campo-tipo-processo");
  campoProcesso.classList.toggle("hidden", tipo !== "portuguesa");
  document.getElementById("tipo-processo-portugues").value = "";
  document.getElementById("portugal-documentos").classList.add("hidden");
  document.getElementById("box-genealogia").classList.toggle("hidden", tipo === "" || tipo === "portuguesa");
  document.getElementById("titulo-genealogia").textContent = "Árvore Genealógica (Gerações)";
  document.getElementById("btn-add-geracao").textContent = "+ Adicionar Geração";
  document.getElementById("geracoes").innerHTML = "";
  if (tipo === "alema") criarPessoa(1);
}

function alterarProcessoPortugues() {
  const processo = document.getElementById("tipo-processo-portugues").value;
  const genealogico = processosGenealogicosPortugal.includes(processo);
  const documental = ["casamento", "homologacao"].includes(processo);
  const box = document.getElementById("box-genealogia");
  const docs = document.getElementById("portugal-documentos");

  box.classList.toggle("hidden", !(genealogico || documental));
  docs.classList.toggle("hidden", !documental);

  document.getElementById("titulo-genealogia").textContent = documental ? "Dados do português / linha familiar" : "Linha Familiar";
  document.getElementById("btn-add-geracao").textContent = ["casamento", "homologacao"].includes(processo) ? "+ Adicionar cônjuge do português" : "+ Adicionar pessoa / geração";
  document.getElementById("geracoes").innerHTML = "";

  if (genealogico || documental) {
    criarPessoa(1);
    document.querySelectorAll(".same-generation-button").forEach(btn => btn.classList.add("no-same-generation"));
  }

  document.querySelectorAll(".campos-casamento-portugal").forEach(el => {
    const cartao = el.closest(".card");
    const estadoCivil = cartao?.querySelector(".casamento-status")?.value;
    el.classList.toggle("hidden", !(processo === "casamento" && estadoCivil === "casado"));
  });

  if (documental) montarCamposProcessoPortugal(processo);
  else {
    document.getElementById("campos-processo-portugues").innerHTML = "";
    document.getElementById("lista-documentos-portugueses").innerHTML = "";
  }
}

function togglePaisResidencia(mostrar) {
  const wrap = document.getElementById("pais-residencia-wrap");
  wrap.classList.toggle("hidden", !mostrar);
  if (!mostrar) document.getElementById("pais-residencia").value = "";
}

function togglePaisResidenciaPortugal(radio, mostrar) {
  const bloco = radio.closest(".pt-residencia-requerente, .portugal-extra");
  const wrap = bloco?.querySelector(".pt-pais-residencia-wrap");
  wrap?.classList.toggle("hidden", !mostrar);
  if (!mostrar) {
    const pais = bloco?.querySelector(".pt-pais-residencia");
    if (pais) pais.value = "";
  }
}

function toggleRequerentePortugalDocumental(checkbox) {
  const campos = checkbox.closest("#campos-processo-portugues");
  const idade = campos?.querySelector(".pt-idade");
  const residencia = campos?.querySelector(".pt-residencia-requerente");
  const processo = document.getElementById("tipo-processo-portugues").value;
  if (idade) idade.classList.toggle("hidden", !checkbox.checked);
  if (residencia) residencia.classList.toggle("hidden", !(checkbox.checked && processo === "casamento"));
  if (!checkbox.checked && residencia) {
    residencia.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
    residencia.querySelector(".pt-pais-residencia-wrap")?.classList.add("hidden");
    const pais = residencia.querySelector(".pt-pais-residencia");
    if (pais) pais.value = "";
  }
}

function togglePerfilhacao(radio) {
  const bloco = radio.closest(".perfilhacao-section");
  const detalhes = bloco?.querySelector(".perfilhacao-detalhes");
  if (!detalhes) return;

  const mostrar = radio.checked && radio.value === "Sim";
  detalhes.classList.toggle("hidden", !mostrar);

  if (!mostrar) {
    detalhes.querySelectorAll("select, input, textarea").forEach(el => el.value = "");
  }
}

function toggleReconhecimento(select) {
  const card = select.closest(".card");
  const detalhes = card?.querySelector(".dados-reconhecimento");
  if (!detalhes) return;

  const mostrar = select.value === "reconhecido";
  detalhes.classList.toggle("hidden", !mostrar);

  if (!mostrar) {
    detalhes.querySelectorAll("input").forEach(el => el.value = "");
  }
}

function campoPortugal(rotulo, classe, tipo = "text", placeholder = "") {
  const ehData = tipo === "date";
  return `<div class="row"><input type="${ehData ? "text" : tipo}" class="${classe}${ehData ? " date-br" : ""}" ${ehData ? 'inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA"' : `placeholder="${rotulo}"`} aria-label="${rotulo}" ${placeholder ? `title="${placeholder}"` : ""}></div>`;
}

function montarCamposProcessoPortugal(processo) {
  const campos = document.getElementById("campos-processo-portugues");
  const lista = document.getElementById("lista-documentos-portugueses");
  campos.innerHTML = "";
  lista.innerHTML = "";
  proximoIdDocumentoPortugal = 1;

  if (processo === "casamento") {
    campos.innerHTML = `
      <div class="title">Dados do Assento de casamento português</div>
      <div class="row"><input inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" class="pt-data-casamento date-br" type="text" aria-label="Data do casamento"><input class="pt-tempo-casados" type="number" min="0" placeholder="Tempo de casados (anos)"></div>
      <div class="row"><input class="pt-local-casamento" placeholder="Local do casamento / conservatória"><input class="pt-numero-assento-casamento" placeholder="Número/ano do assento de casamento"></div>
      <div class="portugal-extra">
        <div class="field-label">A procuração está correta?</div>
        <div class="radio-wrap"><label><input type="radio" name="pt-procuracao-casamento" value="Sim"> Sim</label><label><input type="radio" name="pt-procuracao-casamento" value="Não"> Não</label></div>
      </div>
      <div class="portugal-extra campo-antecedentes-casamento">
        <div class="field-label">Possui certidão de antecedentes criminais?</div>
        <div class="radio-wrap"><label><input type="radio" name="pt-antecedentes-casamento" value="Sim"> Sim</label><label><input type="radio" name="pt-antecedentes-casamento" value="Não"> Não</label></div>
      </div>`;
    adicionarDocumentoPortugues("Assento de nascimento do português");
    adicionarDocumentoPortugues("Assento de casamento");
    adicionarDocumentoPortugues("Certidão de nascimento do cônjuge/requerente");
  } else {
    campos.innerHTML = `
      <div class="title">Dados do casamento e do divórcio</div>

function calcularIdadePelaDataNascimento(dataNascimento) {
  if (!dataNascimento) return "";

  const valor = String(dataNascimento).trim();
  let dia, mes, ano;

  if (/^\d{2}\/\d{2}\/\d{4}$/.test(valor)) {
    [dia, mes, ano] = valor.split("/").map(Number);
  } else if (/^\d{4}-\d{2}-\d{2}$/.test(valor)) {
    [ano, mes, dia] = valor.split("-").map(Number);
  } else {
    return "";
  }

  const nascimento = new Date(ano, mes - 1, dia);
  const hoje = new Date();

  // Evita aceitar datas inválidas ou futuras.
  if (
    nascimento.getFullYear() !== ano ||
    nascimento.getMonth() !== mes - 1 ||
    nascimento.getDate() !== dia ||
    nascimento > hoje
  ) return "";

  let idade = hoje.getFullYear() - ano;
  const aindaNaoFezAniversario =
    hoje.getMonth() < mes - 1 ||
    (hoje.getMonth() === mes - 1 && hoje.getDate() < dia);

  if (aindaNaoFezAniversario) idade--;
  return String(idade);
}

function atualizarIdadeRequerente(campoNascimento) {

  if (!card) return;

  const campoIdade = card.querySelector(".idade-requerente-valor");
  if (!campoIdade) return;

  campoIdade.value = calcularIdadePelaDataNascimento(campoNascimento.value);

function toggleRequerente(checkboxElement) {
  const card = checkboxElement.closest(".card");
  const docSection = card.querySelector(".doc-section");

  if (checkboxElement.checked) {
    docSection.classList.remove("hidden");
    const idade = card.querySelector(".idade-requerente");
    if (idade) idade.classList.remove("hidden");

    const nascimento = card.querySelector(".nasc");
    if (nascimento) atualizarIdadeRequerente(nascimento);

    const residencia = card.querySelector(".residencia-requerente");
    const processo = document.getElementById("tipo-processo-portugues").value;
    if (residencia) residencia.classList.toggle("hidden", !(document.getElementById("tipo-cidadania").value === "portuguesa" && processosComResidenciaPortugal.includes(processo)));

    const representante = card.querySelector(".dados-representante-menor");
    if (representante) representante.classList.toggle("hidden", !(document.getElementById("tipo-cidadania").value === "portuguesa" && ["netos-menores", "filho-menor"].includes(processo)));

    const procuracao = card.querySelector(".campo-procuracao-requerente");
    if (procuracao) procuracao.classList.toggle("hidden", document.getElementById("tipo-cidadania").value !== "portuguesa");

    const antecedentes = card.querySelector(".campo-antecedentes-requerente");
    if (antecedentes) antecedentes.classList.toggle("hidden", !(document.getElementById("tipo-cidadania").value === "portuguesa" && ["netos-maiores", "netos-menores"].includes(processo)));
  } else {
    docSection.classList.add("hidden");
    const idade = card.querySelector(".idade-requerente-valor");
    if (idade) idade.value = "";

    const representante = card.querySelector(".dados-representante-menor");
    if (representante) {
      representante.classList.add("hidden");
      representante.querySelectorAll("input, select").forEach(el => el.value = "");
    }

    const procuracao = card.querySelector(".campo-procuracao-requerente");
    if (procuracao) {
      procuracao.classList.add("hidden");
      procuracao.querySelectorAll('input[type="radio"]').forEach(el => el.checked = false);
    }

    const residencia = card.querySelector(".residencia-requerente");
    if (residencia) {
      residencia.classList.add("hidden");
      residencia.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
      residencia.querySelector(".pais-residencia-requerente")?.classList.add("hidden");
      const pais = residencia.querySelector(".pais-residencia-valor");
      if (pais) pais.value = "";
    }

    docSection.querySelector(".doc-tipo").value = "";
    docSection.querySelector(".doc-num").value = "";
    docSection.querySelector(".doc-validade").value = "";
  }
}

  const processo = document.getElementById("tipo-processo-portugues")?.value;
  const tipo = document.getElementById("tipo-cidadania")?.value;

  if (tipo === "portuguesa" && ["casamento", "homologacao"].includes(processo)) {
    if (document.querySelector("#geracoes .cartao-conjuge-processo")) {
      alert("Os dados do cônjuge já foram adicionados.");
      return;
    }
    criarConjugePortugal(processo);
    return;
  }

  criarPessoa(proximaGeracao());
}

function adicionarMesmaGeracao(btn) {
  const cardAtual = btn.closest(".card");
  const numeroGeracao = Number(cardAtual.dataset.geracao);
  const pessoasMesmaGeracao = document.querySelectorAll(`#geracoes .card[data-geracao="${numeroGeracao}"]`).length;
  criarPessoa(numeroGeracao, pessoasMesmaGeracao);
}

function coletarCamposPortugal(container) {
  const resultado = [];

  container.querySelectorAll("input, select, textarea").forEach(el => {
    if (el.type === "radio" && !el.checked) return;
    if (el.type === "checkbox" && !el.checked) return;

    let rotulo = el.getAttribute("placeholder") || el.getAttribute("aria-label") || el.name || "Informação";

    if (el.classList.contains("pt-documento-requerente")) rotulo = "A pessoa deste documento é o requerente?";
    if (el.type === "radio" && el.name === "pt-sentenca-transito") rotulo = "Possuímos a sentença de divórcio e o trânsito em julgado?";
    if (el.type === "radio" && el.name.startsWith("pt-procuracao-")) rotulo = "A procuração está correta?";
    if (el.type === "radio" && el.name === "pt-filhos-reconhecidos") rotulo = "Tem filhos reconhecidos como portugueses?";
    if (el.type === "radio" && el.name === "pt-conjuge-residiu-fora") rotulo = "O requerente já residiu fora do Brasil?";
    if (el.type === "radio" && el.name === "pt-conjuge-nome-alterado") rotulo = "O nome do requerente foi alterado?";

    const valorBruto = el.type === "checkbox" ? "Sim" : (el.value || "");

    if (String(valorBruto).trim()) {
      const valor = el.classList.contains("date-br")
        ? formatarDataPortugal(valorBruto)
        : valorBruto;

      resultado.push([rotulo, valor]);
    }
  });

  return resultado;
}

function adicionarDivergenciasDocumentoPDF(pdf, card, margemEsquerda) {
  let yLocal = pdf.lastAutoTable ? pdf.lastAutoTable.finalY + 5 : 40;
  const status = card.querySelector(".divergencia-status:checked")?.value || "nao";

  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(10);
  pdf.setTextColor(139,30,63);

  if (yLocal > 265) { pdf.addPage(); yLocal = 20; }

  pdf.text("Análise Documental – Divergências Identificadas", margemEsquerda, yLocal);
  yLocal += 6;

  if (status === "nao") {
    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(9.5);
    pdf.text("Não foram identificadas divergências documentais.", margemEsquerda, yLocal);
    return yLocal + 8;
  }

  const itens = Array.from(card.querySelectorAll(".divergencia-item"));

  if (!itens.length) {
    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(9.5);
    pdf.text("Foram identificadas divergências, mas nenhum detalhe foi preenchido.", margemEsquerda, yLocal);
    return yLocal + 8;
  }

  itens.forEach((item, index) => {
    pdf.autoTable({
      startY: yLocal,
      head: [],
      body: [
        [`Divergência ${index + 1} — Documento`, item.querySelector(".divergencia-documento")?.value.trim() || "Não informado"],
        ["Qual dado está errado?", item.querySelector(".divergencia-dado-errado")?.value.trim() || "Não informado"],
        ["Como consta no documento", item.querySelector(".divergencia-consta")?.value.trim() || "Não informado"],
        ["Como deveria constar", item.querySelector(".divergencia-deveria")?.value.trim() || "Não informado"]
      ],
      theme: "grid",
      styles: { font: "helvetica", fontSize: 9, cellPadding: 3.2, overflow: "linebreak", textColor: [60,65,75], lineColor: [229,202,213], lineWidth: 0.3, valign: "top" },
      columnStyles: { 0: { cellWidth: 55, fontStyle: "bold", fillColor: [248,237,242], textColor: [116,22,48] }, 1: { cellWidth: "auto", fillColor: [255,252,253] } },
      margin: { left: margemEsquerda, right: 14, bottom: 18 },
      pageBreak: "auto",
      rowPageBreak: "avoid"
    });
    yLocal = pdf.lastAutoTable.finalY + 4;
  });

  return yLocal + 5;
}


function desenharCabecalhoExtrato(pdf, subtitulo, tipoCidadania) {
  const vinho = [126, 29, 57];
  const cinzaTexto = [62, 70, 80];
  const cinzaFundo = [247, 248, 249];

  // Cartela clara com título editorial e assinatura discreta.
  pdf.setFillColor(...cinzaFundo);
  pdf.setDrawColor(229, 232, 236);
  pdf.setLineWidth(0.35);
  pdf.roundedRect(14, 10, 182, 27, 2.5, 2.5, "FD");

  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(14);
  pdf.setTextColor(...vinho);
  pdf.text("ANÁLISE DOCUMENTAL", 20, 21);

  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(9);
  pdf.setTextColor(...cinzaTexto);
  pdf.text(subtitulo, 20, 29);

  // Assinatura cromática fina, sem competir com o conteúdo.
  pdf.setFillColor(...vinho);
  pdf.roundedRect(14, 10, 1.5, 27, 0.7, 0.7, "F");

  if (tipoCidadania === "portuguesa") {
    pdf.setFillColor(0, 102, 70);
    pdf.rect(168, 17, 8, 1.2, "F");
    pdf.setFillColor(200, 16, 46);
    pdf.rect(176, 17, 12, 1.2, "F");
  } else {
    pdf.setFillColor(17, 24, 37);
    pdf.rect(168, 17, 7, 1.2, "F");
    pdf.setFillColor(221, 0, 0);
    pdf.rect(175, 17, 7, 1.2, "F");
    pdf.setFillColor(212, 175, 55);
    pdf.rect(182, 17, 7, 1.2, "F");
  }

  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(7);
  pdf.setTextColor(126, 29, 57);
  pdf.text("CIDADANIA4U", 188, 29, { align: "right" });
}

function gerarPDF() {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert("Não foi possível carregar a biblioteca do PDF. Verifique sua conexão com a internet e tente novamente.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const margemEsquerda = 14;
  const larguraUtil = 182;
  const tipoCidadania = document.getElementById("tipo-cidadania").value;
  const processoPortugal = document.getElementById("tipo-processo-portugues").value;

  if (!tipoCidadania) {
    alert("Selecione o tipo de cidadania antes de gerar o PDF.");
    return;
  }

  if (tipoCidadania === "portuguesa" && !processoPortugal) {
    alert("Selecione o tipo de processo português antes de gerar o PDF.");
    return;
  }

  /* A validação é executada somente para Portugal */
  if (tipoCidadania === "portuguesa") {
    if (!validarCamposObrigatoriosPortugal()) return;
  }

  if (tipoCidadania === "portuguesa" && ["casamento", "homologacao"].includes(processoPortugal)) {
    const nomeProcesso = document.querySelector('#tipo-processo-portugues option:checked')?.textContent || "";
    desenharCabecalhoExtrato(pdf, "Cidadania Portuguesa  |  " + nomeProcesso, "portuguesa");
    let yPt = 45;

    document.querySelectorAll("#geracoes > .card").forEach((c) => {
      const ehConjuge = c.classList.contains("cartao-conjuge-processo");
      const nomePessoa = c.querySelector(".nome")?.value.trim() || c.querySelector(".pt-conjuge-nome")?.value.trim() || "Nome não informado";

      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(11);
      pdf.setTextColor(17,24,37);
      pdf.text((ehConjuge ? "Cônjuge / ex-cônjuge: " : "Português / pessoa da linha familiar: ") + nomePessoa, 14, yPt);
      yPt += 4;

      const dadosPessoa = [];

      c.querySelectorAll("input, select, textarea").forEach(el => {
        if (el.closest(".divergencia-section") || el.classList.contains("observacoes-pessoa") || el.type === "button") return;
        if (el.type === "radio" && !el.checked) return;
        if (el.type === "checkbox" && !el.checked) return;
        if (el.classList.contains("same-generation-button")) return;

        const rotulo = el.getAttribute("placeholder") || el.getAttribute("aria-label") ||
          (el.classList.contains("is-requerente") ? "É requerente?" :

          el.classList.contains("doc-num") ? "Número do documento do requerente" :
          el.classList.contains("doc-validade") ? "Validade do documento do requerente" :
          el.classList.contains("procuracao-requerente") ? "A procuração está correta?" : "Informação");

        const valorBruto = el.type === "checkbox" ? "Sim" : (el.value || "");

        if (String(valorBruto).trim()) {
          const valor = el.classList.contains("date-br")
            ? formatarDataPortugal(valorBruto)
            : valorBruto;

          dadosPessoa.push([rotulo, valor]);
        }
      });

      if (dadosPessoa.length) {
        pdf.autoTable({
          startY:yPt,
          head:[],
          body:dadosPessoa,
          theme:"plain",
          styles:{font:"helvetica",fontSize:9.5,cellPadding:3.2,overflow:"linebreak",textColor:[60,65,75],valign:"top"},
          columnStyles:{0:{cellWidth:65,fontStyle:"bold",textColor:[100,110,120]},1:{cellWidth:"auto"}},
          margin:{left:14,right:14,bottom:18}
        });
        yPt = pdf.lastAutoTable.finalY + 3;
      }

      yPt = adicionarDivergenciasDocumentoPDF(pdf, c, 14) + 3;

      const obsPessoa = c.querySelector(".observacoes-pessoa")?.value.trim();
      if (obsPessoa) {
        pdf.autoTable({
          startY:yPt,
          head:[],
          body:[["Observações após a análise documental",obsPessoa]],
          theme:"plain",
          styles:{font:"helvetica",fontSize:9.5,cellPadding:3.2,overflow:"linebreak"},
          margin:{left:14,right:14,bottom:18}
        });
        yPt = pdf.lastAutoTable.finalY + 6;
      }
    });

    const dadosProcesso = coletarCamposPortugal(document.getElementById("campos-processo-portugues"));

    if (dadosProcesso.length) {
      pdf.autoTable({
        startY:yPt,
        head:[],
        body:dadosProcesso,
        theme:"plain",
        styles:{font:"helvetica",fontSize:9.5,cellPadding:3.2,overflow:"linebreak",textColor:[60,65,75],valign:"top"},
        columnStyles:{0:{cellWidth:65,fontStyle:"bold",textColor:[100,110,120]},1:{cellWidth:"auto"}},
        margin:{left:14,right:14,bottom:18}
      });
      yPt = pdf.lastAutoTable.finalY + 10;
    }

    document.querySelectorAll("#lista-documentos-portugueses .portugal-doc-card").forEach((c, index) => {

      yPt += 4;

          columnStyles:{0:{cellWidth:65,fontStyle:"bold",textColor:[100,110,120]},1:{cellWidth:"auto"}},
          margin:{left:14,right:14,bottom:18}
        });

        margin: { left: 14, right: 14, bottom: 18 }

    pdf.save("analise-cidadania-portuguesa.pdf");
    return;
  }

  function garantirEspaco(altura) {

      pdf.addPage();

        dadosFicha.push(["Nome completo do pai", representante.querySelector(".pai-nome")?.value.trim() || "-"]);
        dadosFicha.push(["Tipo de documento do pai", representante.querySelector(".pai-doc-tipo")?.value || "-"]);
        dadosFicha.push(["Número do documento do pai", representante.querySelector(".pai-doc-num")?.value.trim() || "-"]);
        dadosFicha.push(["Validade do documento do pai", formatarDataPortugal(representante.querySelector(".pai-doc-validade")?.value)]);
        dadosFicha.push(["Nome completo da mãe", representante.querySelector(".mae-nome")?.value.trim() || "-"]);
        dadosFicha.push(["Tipo de documento da mãe", representante.querySelector(".mae-doc-tipo")?.value || "-"]);
        dadosFicha.push(["Número do documento da mãe", representante.querySelector(".mae-doc-num")?.value.trim() || "-"]);
        dadosFicha.push(["Validade do documento da mãe", formatarDataPortugal(representante.querySelector(".mae-doc-validade")?.value)]);
      }
    }

    const identificacaoGeracao = subGeracao ? `${numeroGeracao}.${subGeracao}` : `${numeroGeracao}`;
    let tituloTexto = `Geração ${identificacaoGeracao} - ${parentescoTexto}: ${nome}`;
    if (ehRequerente) tituloTexto += " [REQUERENTE DO PROCESSO]";

    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(11);
    const linhasTitulo = pdf.splitTextToSize(tituloTexto, larguraUtil - 10);
    const alturaTitulo = linhasTitulo.length * 5 + 8;

    garantirEspaco(alturaTitulo + 20);

    // Cabeçalho clean: cinza mineral, texto grafite e vinho só como acento.
    if (ehRequerente) {
      pdf.setFillColor(242, 239, 241);
      pdf.setDrawColor(207, 190, 198);
      pdf.setTextColor(83, 43, 59);
    } else {
      pdf.setFillColor(246, 247, 248);
      pdf.setDrawColor(224, 228, 232);
      pdf.setTextColor(57, 67, 78);
    }
    pdf.setLineWidth(0.35);
    pdf.roundedRect(margemEsquerda, y - 4, larguraUtil, alturaTitulo, 2.2, 2.2, "FD");
    pdf.setFillColor(126, 29, 57);
    pdf.roundedRect(margemEsquerda, y - 4, 1.35, alturaTitulo, 0.6, 0.6, "F");
    pdf.text(linhasTitulo, margemEsquerda + 5, y + 1);

    const linhaY = y + alturaTitulo - 1;

    pdf.autoTable({
      startY: linhaY + 2,
      head: [],
      body: dadosFicha,
      theme: "plain",
      styles: { font: "helvetica", fontSize: 9.5, cellPadding: 3.2, overflow: "linebreak", textColor: [60,65,75], fillColor: [255,255,255], valign: "top" },
      columnStyles: {
        0: { cellWidth: 55, fontStyle: "bold", textColor: [91,101,112], fillColor: [248,249,250] },
        1: { cellWidth: "auto" }
      },
      margin: { left: margemEsquerda, right: 14, bottom: 18 },
      didParseCell: function(data) {
        data.cell.styles.lineWidth = { bottom: 0.1 };
        data.cell.styles.lineColor = [230,235,240];

        const rotulo = String(data.row.raw?.[0] || "");
        if (
          rotulo === "A perfilhação está comprovada?" ||
          rotulo === "Comprovação da perfilhação"
        ) {
          data.cell.styles.fillColor = [248, 237, 242];
          data.cell.styles.textColor = [116, 22, 48];
          data.cell.styles.fontStyle = "bold";
        }
      }
    });

    y = pdf.lastAutoTable.finalY + 8;

    const statusDivergencia = c.querySelector(".divergencia-status:checked")?.value || "nao";

    garantirEspaco(18);
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(10);
    pdf.setTextColor(139, 30, 63);
    pdf.text("Análise Documental – Divergências Identificadas", margemEsquerda, y);
    y += 6;

    if (statusDivergencia === "nao") {
      pdf.setFont("helvetica", "normal");
      pdf.setFontSize(9.5);
      pdf.setTextColor(60, 65, 75);
      pdf.text("Não foram identificadas divergências documentais.", margemEsquerda, y);
      y += 7;
    } else {
      const divergencias = Array.from(c.querySelectorAll(".divergencia-item"));

      if (divergencias.length === 0) {
        garantirEspaco(12);
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(9.5);
        pdf.text("Foram identificadas divergências, mas nenhum detalhe foi preenchido.", margemEsquerda, y);
        y += 7;
      } else {
        divergencias.forEach((item, index) => {
          const documento = item.querySelector(".divergencia-documento").value.trim() || "Não informado";
          const consta = item.querySelector(".divergencia-consta").value.trim() || "Não informado";
          const deveria = item.querySelector(".divergencia-deveria").value.trim() || "Não informado";

          const tabelaDivergencia = [
            [`Divergência ${index + 1} — Documento`, documento],
            ["Qual dado está errado?", item.querySelector(".divergencia-dado-errado")?.value.trim() || "Não informado"],
            ["Como consta no documento", consta],
            ["Como deveria constar", deveria]
          ];

          pdf.autoTable({
            startY: y,
            head: [],
            body: tabelaDivergencia,
            theme: "grid",
            styles: {
              font: "helvetica",
              fontSize: 9,
              cellPadding: 3.2,
              overflow: "linebreak",
              textColor: [60,65,75],
              lineColor: [229, 202, 213],
              lineWidth: 0.3,
              valign: "top"
            },
            columnStyles: {
              0: {
                cellWidth: 55,
                fontStyle: "bold",
                fillColor: [248, 237, 242],
                textColor: [116, 22, 48]
              },
              1: {
                cellWidth: "auto",
                fillColor: [255, 252, 253]
              }
            },
            margin: { left: margemEsquerda, right: 14, bottom: 18 },
            pageBreak: "auto",
            rowPageBreak: "avoid"
          });

          y = pdf.lastAutoTable.finalY + 4;
        });
        y += 2;
      }
    }

    const observacoesPessoa = c.querySelector(".observacoes-pessoa")?.value.trim();

    if (observacoesPessoa) {
      pdf.autoTable({
        startY: y,
        head: [],
        body: [["Observações", observacoesPessoa]],
        theme: "plain",
        styles: { font: "helvetica", fontSize: 9.5, cellPadding: 3.2, overflow: "linebreak", textColor: [60,65,75], valign: "top" },
        columnStyles: { 0: { cellWidth: 55, fontStyle: "bold" }, 1: { cellWidth: "auto" } },
        margin: { left: margemEsquerda, right: 14, bottom: 18 }
      });
      y = pdf.lastAutoTable.finalY + 5;
    }

    y += 8;
  });

  if (tipoCidadania === "portuguesa") {
    pdf.save("analise-cidadania-portuguesa.pdf");
  } else {
    pdf.save("analise-cidadania-alema.pdf");
  }
}
</script>
</body>
</html>
